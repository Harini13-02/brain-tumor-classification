services:
  - type: web
    name: brain-tumor-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: MODELS_DIR
        value: models
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
